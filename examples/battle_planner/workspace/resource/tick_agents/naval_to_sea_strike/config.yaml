META:
  id: 10002
  name: 舰对海打击智能体
  description: |
    # 舰对海打击智能体

    在指定时间窗口内组织水面舰艇使用舰载导弹打击海上目标。

    ## 适用场景
    - 固定海上目标打击。
    - 红方不主动防御或防御影响暂不建模。
    - 可作为空对海打击后的补充打击手段。

    ## 行为逻辑
    智能体在 `start_time <= sim_time <= end_time` 且尚未下发过任务时，输出一次 `舰对海打击智能体` 类型任务。

    ## 输出说明
    输出由 `pysim.schema.action.MissionFormatter.attack` 构建的标准 mission action。
PARAMS:
- name: start_time
  type: 浮点数
  default_value: null
  chineseName: start_time
  description: 智能体开始运行时间，单位秒。
  required: true
- name: end_time
  type: 浮点数
  default_value: null
  chineseName: end_time
  description: 智能体停止运行时间，单位秒。
  required: true
- name: unit_ids
  type: 列表
  default_value: null
  chineseName: unit_ids
  description: 执行任务的舰艇单位 id 列表。
  required: true
- name: target_ids
  type: 列表
  default_value: null
  chineseName: target_ids
  description: 海上目标单位 id 列表。
  required: true
- name: wp_num
  type: 整数
  default_value: 2
  chineseName: wp_num
  description: 每个目标分配的舰载导弹数量。
  required: false
- name: clear_targets
  type: 布尔值
  default_value: true
  chineseName: clear_targets
  description: 是否清理旧目标。
  required: false
STATUS:
- 运行中
- 已结束
VERSION: 0.1.0
