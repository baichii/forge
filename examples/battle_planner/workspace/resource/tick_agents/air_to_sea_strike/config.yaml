META:
  id: 10001
  name: 空对海突击
  description: |
    # 空对海打击智能体

    在指定时间窗口内组织空中单位对海上目标执行打击任务。

    ## 适用场景
    - 固定海上目标打击。
    - 红方不主动防御或防御影响暂不建模。
    - 以摧毁关键海上目标为主要目标，并关注武器消耗。

    ## 行为逻辑
    智能体在 `start_time <= sim_time <= end_time` 且尚未下发过任务时，输出一次 `对海打击` 类型任务。

    ## 输出说明
    输出由 `pysim.schema.action.MissionFormatter.air_attack` 构建的标准 mission action。
PARAMS:
- name: start_time
  type: 浮点数
  default_value: null
  chineseName: 开始时间
  description: 智能体开始运行时间，单位秒。
  required: true
- name: end_time
  type: 浮点数
  default_value: null
  chineseName: 结束时间
  description: 智能体停止运行时间，单位秒。
  required: true
- name: unit_ids
  type: 列表
  default_value: null
  chineseName: 执行单位 ID 列表
  description: 执行任务的飞机单位 id 列表。
  required: true
- name: target_ids
  type: 列表
  default_value: null
  chineseName: 目标单位 ID 列表
  description: 海上目标单位 id 列表。
  required: true
- name: wp_num
  type: 整数
  default_value: 2
  chineseName: 武器数量
  description: 每个目标分配的武器数量。
  required: false
- name: clear_targets
  type: 布尔值
  default_value: true
  chineseName: 清理旧目标
  description: 是否清理旧目标。
  required: false
STATUS:
- 运行中
- 已结束
VERSION: 0.1.0
