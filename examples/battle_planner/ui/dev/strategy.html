  <script>
    const strategies = {
      alpha: {
        path: "推演方案 / 分支 A / 蓝方联合打击",
        title: "蓝方联合打击",
        desc: "优先确保关键目标毁伤，同时降低我方平台长时间暴露；LLM 只生成执行参数建议，不修改上游方案结构。"
      },
      bravo: {
        path: "推演方案 / 分支 B / 多批次牵制",
        title: "岛链掩护突防策略",
        desc: "以多批次牵制争取通道窗口，偏好保留返航余量，避免为了单轮 score 牺牲可解释性。"
      },
      charlie: {
        path: "推演方案 / 分支 C / 侦察确认",
        title: "近岸目标夺控策略",
        desc: "先验证目标状态，再逐段推进打击任务；当 report 信心不足时优先补充侦察调用。"
      }
    };

    const strategySelect = document.getElementById("strategySelect");

    function setStrategy(strategyKey, statusText) {
      document.querySelectorAll(".item").forEach((item) => {
        item.classList.toggle("active", item.dataset.strategy === strategyKey);
      });
      strategySelect.value = strategyKey;
      const current = strategies[strategyKey];
      document.getElementById("strategyPath").textContent = current.path;
      document.getElementById("strategyTitle").textContent = current.title;
      document.getElementById("strategyDesc").textContent = current.desc;
      document.getElementById("saveState").textContent = statusText;
    }
